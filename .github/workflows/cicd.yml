name: CI-CD

on:
  push:
    branches: [ dev-den ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev-den ]

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -G "Ninja"

      - name: Build
        run: cmake --build build --config %BUILD_TYPE%

      - name: Package artifact
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $exe = Join-Path "build" "SurveillanceCameraWithAI.exe"
          if (-not (Test-Path $exe)) {
            $exe = Join-Path "build" "Release/SurveillanceCameraWithAI.exe"
          }
          if (-not (Test-Path $exe)) {
            throw "Executable not found at $exe"
          }
          Copy-Item $exe (Join-Path $dist "SurveillanceCameraWithAI.exe") -Force
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath SurveillanceCameraWithAI-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveillanceCameraWithAI-win64
          path: SurveillanceCameraWithAI-win64.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: SurveillanceCameraWithAI-win64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
