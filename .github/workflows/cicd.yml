name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
        default: Release
      triplet:
        description: 'vcpkg target triplet'
        type: choice
        options:
          - x64-windows
          - x64-windows-static
          - arm64-windows
        default: x64-windows
      run_tests:
        description: 'Run CTest after build'
        type: boolean
        default: true
      package_artifacts:
        description: 'Package the distributable zip'
        type: boolean
        default: true
      publish_release:
        description: 'Force publishing a GitHub release'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag name when forcing a release'
        required: false

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  BUILD_DIR: build
  DIST_DIR: dist
  EXECUTABLE_NAME: SurveillanceCameraWithAI.exe
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'Release' }}
  VCPKG_TARGET_TRIPLET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.triplet || 'x64-windows' }}
  RUN_TESTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests || 'true' }}
  PACKAGE_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_artifacts || 'true' }}
  FORCE_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release || 'false' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  ARCHIVE_PATH: "C:/Users/runneradmin/AppData/Local/vcpkg/archives"
  VCPKG_BINARY_SOURCES: "clear;files,C:/Users/runneradmin/AppData/Local/vcpkg/archives,readwrite"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create vcpkg cache key
        id: cache-key
        shell: pwsh
        run: |
          $hash = Get-FileHash "vcpkg.json" -Algorithm SHA256
          echo "KEY=${{ runner.os }}-vcpkg-$($hash.Hash)" >> $env:GITHUB_OUTPUT
      # 1. МАГІЧНИЙ КРОК: Створюємо папку вручну, щоб actions/cache не видавав помилку
      - name: Create archive directory
        run: New-Item -ItemType Directory -Force -Path "${{ env.ARCHIVE_PATH }}"

      # 2. Налаштовуємо кеш (використовуємо офіційний action v4)
      - name: Restore/Save vcpkg archives
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.ARCHIVE_PATH }}
          key: ${{ steps.cache-key.outputs.KEY }}

      # 3. Якщо кешу немає - запускаємо vcpkg
      - name: Install Dependencies (vcpkg)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true
             
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Show build plan
        run: |
          Write-Host "Configuration summary:"
          Write-Host "  Build type........... $env:BUILD_TYPE"
          Write-Host "  vcpkg triplet........ $env:VCPKG_TARGET_TRIPLET"
          Write-Host "  Run tests............ $env:RUN_TESTS"
          Write-Host "  Package artifacts.... $env:PACKAGE_ARTIFACTS"
          Write-Host "  Force release........ $env:FORCE_PUBLISH_RELEASE"

      - name: Configure CMake
        run: >
          cmake -B "${{ env.BUILD_DIR }}" -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}
          -G Ninja

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config "${{ env.BUILD_TYPE }}"

      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' }}
        run: ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure --build-config "${{ env.BUILD_TYPE }}"

      - name: Package artifact
        if: ${{ env.PACKAGE_ARTIFACTS == 'true' }}
        run: |
          $buildDir = "${{ env.BUILD_DIR }}"
          $dist = "${{ env.DIST_DIR }}"
          $exeName = "${{ env.EXECUTABLE_NAME }}"
          
          # 1. Створюємо папку dist
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # 2. Знаходимо та копіюємо EXE (тут ваш старий код був ок)
          $candidatePaths = @(
            Join-Path $buildDir $exeName
            Join-Path (Join-Path $buildDir $env:BUILD_TYPE) $exeName
            Join-Path (Join-Path $buildDir "bin") $exeName
          )
          $exePath = $null
          foreach ($candidate in $candidatePaths) {
            if ($candidate -and (Test-Path $candidate)) {
              $exePath = (Get-Item $candidate).FullName
              break
            }
          }
          if (-not $exePath) { throw "Executable not found." }
          
          Copy-Item $exePath (Join-Path $dist $exeName) -Force
          
          # Отримуємо папку, де лежить exe (це корінь збірки)
          $binDir = Split-Path $exePath -Parent

          # 3. Копіюємо всі DLL поруч з exe
          Get-ChildItem -Path $binDir -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName -Destination $dist -Force
          }

          # 4. ВАЖЛИВО: Копіюємо папки плагінів Qt (platforms, tls, styles і т.д.)
          # CMake створює їх поруч з exe, треба перенести в dist
          $qtPlugins = @("platforms", "styles", "tls", "iconengines", "imageformats", "renderers")
          foreach ($plugin in $qtPlugins) {
            $srcPath = Join-Path $binDir $plugin
            if (Test-Path $srcPath) {
               Copy-Item -Path $srcPath -Destination $dist -Recurse -Force
            }
          }

          # 5. ВАЖЛИВО: Копіюємо папку assets (моделі)
          # Вона може бути в корені репозиторію або скопійована в build
          $assetsSrc = "assets"
          if (Test-Path $assetsSrc) {
             Copy-Item -Path $assetsSrc -Destination $dist -Recurse -Force
          }

          # 6. Архівуємо
          $artifactName = "SurveillanceCameraWithAI-${{ env.VCPKG_TARGET_TRIPLET }}-${{ env.BUILD_TYPE }}"
          $zipPath = "$artifactName.zip"
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zipPath -Force
          
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        if: ${{ env.PACKAGE_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}

      - name: Publish Release
        if: ${{ env.PACKAGE_ARTIFACTS == 'true' && (startsWith(github.ref, 'refs/tags/v') || env.FORCE_PUBLISH_RELEASE == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.ARTIFACT_ZIP }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
