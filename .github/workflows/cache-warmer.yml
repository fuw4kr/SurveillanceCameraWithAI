name: Build Dependencies Only

on:
  workflow_dispatch: # Запуск тільки вручну кнопкою

permissions:
  contents: read
  actions: write # Дозвіл на запис у кеш

jobs:
  warm-up-cache:
    runs-on: windows-latest
    env:
      # Вказуємо vcpkg зберігати бінарники локально, щоб ми могли їх закешувати через actions/cache
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Створюємо унікальний ключ (хеш) на основі vcpkg.json
      - name: Create vcpkg cache key
        id: cache-key
        shell: pwsh
        run: |
          $hash = Get-FileHash "vcpkg.json" -Algorithm SHA256
          echo "KEY=${{ runner.os }}-vcpkg-$($hash.Hash)" >> $env:GITHUB_OUTPUT

      # 2. Налаштовуємо кешування папки archives
      - name: Cache vcpkg archives
        uses: actions/cache@v4
        id: cache
        with:
          # Це шлях, куди vcpkg складає скомпільовані пакети на Windows
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ steps.cache-key.outputs.KEY }}
          
      # 3. Запускаємо vcpkg (Тільки інсталяція залежностей)
      # Якщо кешу немає - він все скомпілює.
      # Якщо кеш є - він просто перевірить цілісність.
      - name: Install Dependencies (vcpkg)
        if: steps.cache.outputs.cache-hit != 'true' # Запускати, тільки якщо кеш не ідеальний
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true # Ця опція змушує vcpkg встановити все з vcpkg.json
          
      # Крок "Post Cache vcpkg archives" виконається автоматично в кінці і збереже все на сервер.